name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Fails the job when coverage drops below fail_under in pyproject.toml.
      - run: echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
      - run: uv run pytest --cov --cov-report=term --cov-report=html --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - name: Upload backend coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov
          if-no-files-found: ignore

  frontend:
    name: Frontend (eslint + tsc + vitest + coverage + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Fails the job when coverage drops below the thresholds in vitest.config.mts.
      - run: npm run test:coverage
      - name: Add frontend coverage to the job summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "coverage/coverage-summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            const lines = ["### Frontend coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["statements", "branches", "functions", "lines"].map(row)];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Upload frontend coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
      - run: npm run build

  docker:
    name: Docker (compose build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Start from the documented template so a copied .env.example is part of what we test.
      - name: Use the example backend settings
        run: cp backend/.env.example backend/.env
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test the running containers
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8000/health
          TOKEN=$(curl --fail --silent -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost:8000/products \
            | python3 -c 'import json, sys; products = json.load(sys.stdin); assert len(products) >= 4, products'
          # Save first: `grep -q` exiting early could EPIPE curl under pipefail.
          curl --fail --silent http://localhost:3000/login -o login.html
          grep "Sign in" login.html > /dev/null
          # The browser path: CORS must admit the UI's origin, and the UI must call this API.
          curl --fail --silent -X OPTIONS http://localhost:8000/auth/login             -H 'Origin: http://localhost:3000' -H 'Access-Control-Request-Method: POST' -D headers.txt -o /dev/null
          grep -i '^access-control-allow-origin: http://localhost:3000' headers.txt
          docker compose exec -T frontend grep -rlF http://localhost:8000 .next/static > /dev/null
          docker compose exec -T backend test -f /data/inventra.db
          echo "Stack is up: API answers, seeded admin can log in, UI serves /login and targets the API."
      - name: Show container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: ${{ !cancelled() }}
        run: docker compose down --volumes
