name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Fails the job when coverage drops below fail_under in pyproject.toml.
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=html --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov
          if-no-files-found: ignore

  frontend:
    name: Frontend (eslint + tsc + vitest + coverage + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Fails the job when coverage drops below the thresholds in vitest.config.mts.
      - run: npm run test:coverage
      - name: Add frontend coverage to the job summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "coverage/coverage-summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            const lines = ["### Frontend coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["statements", "branches", "functions", "lines"].map(row)];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
      - run: npm run build
