# One-command local stack: `docker compose up --build`, then open http://localhost:3000
# (sign in as admin / admin123 or staff / staff123). Data persists in the
# `inventra-data` volume; `docker compose down -v` wipes it.
services:
  backend:
    build: ./backend
    environment:
      INVENTRA_CORS_ORIGINS: http://localhost:3000
      INVENTRA_SEED: "1"
    # Optional overrides, e.g. INVENTRA_SECRET_KEY for anything beyond local use.
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - inventra-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is the host-side address.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  inventra-data:
